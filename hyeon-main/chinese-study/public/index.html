<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>汉语 학습소 · 중국어 학습 도우미</title>
<meta name="description" content="HSK 급수별 단어 학습, 병음 자동 표시, 퀴즈, 문법 설명, 한중 번역, AI 회화 연습까지. 네이버 중국어사전 데이터 기반 중국어 학습 도우미." />
<meta name="theme-color" content="#c8352b" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23c8352b'/%3E%3Ctext x='50' y='72' font-size='62' text-anchor='middle' fill='%23fff' font-family='serif'%3E汉%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="/css/styles.css" />
<script src="/vendor/pinyin-pro.js" defer></script>
</head>
<body>

<a class="skip-link" href="#view">본문 바로가기</a>

<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="#/home" aria-label="홈으로">
      <span class="brand__mark">汉</span>
      <span class="brand__text">
        <strong>汉语 학습소</strong>
        <small>중국어 학습 도우미</small>
      </span>
    </a>

    <form class="search" id="search-form" role="search" autocomplete="off">
      <div class="search__box">
        <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-4.35-4.35M19 11a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
        <input
          id="search-input"
          type="text"
          placeholder="단어 · 문장 · 문법 무엇이든 물어보세요  예) 学习 / 밥 먹었어? / 了 용법"
          aria-label="검색어 입력"
        />
        <button type="button" class="search__mic" id="search-mic" title="음성으로 검색 (중국어)" aria-label="음성으로 검색">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg>
        </button>
        <button type="submit" class="search__go">검색</button>
      </div>
      <div class="search__modes" id="search-modes" role="tablist" aria-label="검색 모드">
        <button type="button" class="chip is-on" data-mode="auto">자동 판별</button>
        <button type="button" class="chip" data-mode="word">단어</button>
        <button type="button" class="chip" data-mode="translate">번역</button>
        <button type="button" class="chip" data-mode="grammar">문법</button>
      </div>
    </form>

    <button class="icon-btn" id="theme-toggle" title="화면 테마 전환" aria-label="화면 테마 전환">
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </div>

  <nav class="tabs" id="tabs" aria-label="주요 메뉴">
    <a href="#/home"    data-tab="home">홈</a>
    <a href="#/words"   data-tab="words">중국어 단어</a>
    <a href="#/quiz"    data-tab="quiz">퀴즈</a>
    <a href="#/chat"    data-tab="chat">AI 회화 연습</a>
    <a href="#/grammar" data-tab="grammar">문법</a>
    <a href="#/stats"   data-tab="stats">학습 통계</a>
  </nav>
</header>

<main id="view" class="view" tabindex="-1"></main>

<nav class="mobilebar" aria-label="모바일 메뉴">
  <a href="#/home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg><span>홈</span></a>
  <a href="#/words" data-tab="words"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 5v14"/></svg><span>단어</span></a>
  <a href="#/quiz" data-tab="quiz"><svg viewBox="0 0 24 24"><path d="M9 9a3 3 0 1 1 4 2.8V14M12 18h.01"/></svg><span>퀴즈</span></a>
  <a href="#/chat" data-tab="chat"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12Z"/></svg><span>회화</span></a>
  <a href="#/stats" data-tab="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>통계</span></a>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
